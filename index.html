<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <title>Begleitinstrument — Analyse & Reflexion</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        html, body, #map { height: 100%; margin: 0; background: #fff; overflow: hidden; font-family: sans-serif; }
        #map { width: 100%; height: 100vh; }
        .rough-path { filter: url(#roughFilter); stroke-linecap: round; }
        .top-ui { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; gap: 8px; }
        .side-ui { position: fixed; top: 70px; right: 12px; z-index: 1000; width: 220px; display: flex; flex-direction: column; gap: 10px; }
        .bottom-left { position: fixed; bottom: 20px; left: 12px; z-index: 1000; display: flex; flex-direction: column; gap: 12px; }
        .panel { background: white; padding: 12px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 1px solid #ddd; }
        .btn { padding: 10px 14px; border-radius: 10px; font-weight: bold; font-size: 10px; cursor: pointer; text-transform: uppercase; border: none; }
        .fab { width: 55px; height: 55px; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 22px; border: none; box-shadow: 0 6px 12px rgba(0,0,0,0.2); cursor: pointer; }
        .walk-item { padding: 8px; border-bottom: 1px solid #eee; font-size: 11px; display: flex; align-items: center; gap: 8px; }
        .color-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="roughFilter"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="4" /></filter>
</svg>

<div id="map"></div>

<div class="top-ui">
    <button id="startWalk" class="btn bg-blue-600 text-white">START</button>
    <button id="stopWalk" class="btn bg-red-600 text-white">STOP</button>
    <button id="exportFull" class="btn bg-black text-white">ZIP</button>
</div>

<div class="side-ui">
    <div class="panel max-h-[200px] overflow-y-auto">
        <p class="font-bold text-[10px] uppercase text-gray-500 mb-2 border-b">Vergleichs-Archiv</p>
        <div id="walkList"></div>
    </div>
    
    <div class="panel">
        <p class="font-bold text-[10px] uppercase text-blue-600 mb-2">Reflexion der Strecke</p>
        <textarea id="reflectionText" class="w-full text-xs p-2 border rounded h-24 mb-2" placeholder="Was fällt dir beim Vergleich auf?"></textarea>
        <button id="saveReflection" class="btn bg-blue-100 text-blue-700 w-full">Reflexion Speichern</button>
    </div>
</div>

<div class="bottom-left">
    <button id="photoBtn" class="fab bg-white">📸</button>
    <button id="audioToggle" class="fab bg-orange-400 text-white">▶️</button>
    <button id="senseBtn" class="fab bg-[#3d633d] text-white">👁️</button>
    <button id="thoughtBtn" class="fab bg-[#12345f] text-white">💭</button>
    <button id="messageToggle" class="fab bg-orange-400 text-white">💬</button>
    <button id="moodBtn" class="fab" style="background: radial-gradient(circle, #ff8c00, #ff4500);">🔋</button>
</div>

<script>
// Farben für verschiedene Walks
const walkColors = ['#000000', '#FF0000', '#0000FF', '#008000', '#800080', '#FF8C00'];

const state = {
    walks: JSON.parse(localStorage.getItem('myWalks') || '[]'),
    current: null,
    map: null,
    activeWalkLayers: {}, // Speichert die Layer-Gruppen pro Walk ID
    audioRecorder: null,
    audioChunks: [],
    isRecording: false
};

function initMap() {
    state.map = L.map('map', { zoomControl: false }).setView([47.23, 9.61], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(state.map);
    
    navigator.geolocation.watchPosition(pos => {
        const { latitude, longitude } = pos.coords;
        if (state.current) {
            state.current.route.push([latitude, longitude]);
            updateLiveRoute();
        }
    }, null, { enableHighAccuracy: true });

    updateArchiveUI();
}

// Live-Route während des Gehens
let liveRouteLayer = null;
function updateLiveRoute() {
    if (liveRouteLayer) state.map.removeLayer(liveRouteLayer);
    liveRouteLayer = L.polyline(state.current.route, { color: '#2563eb', weight: 4, dashArray: '5, 10' }).addTo(state.map);
}

// Walk starten / stoppen
document.getElementById('startWalk').onclick = () => {
    const color = walkColors[state.walks.length % walkColors.length];
    state.current = { 
        id: Date.now(), 
        name: new Date().toLocaleString('de-DE'), 
        route: [], 
        entries: [], 
        color: color,
        reflection: "" 
    };
    alert("Aufzeichnung läuft...");
};

document.getElementById('stopWalk').onclick = () => {
    if (!state.current) return;
    state.walks.push(state.current);
    saveToLocal();
    updateArchiveUI();
    if (liveRouteLayer) state.map.removeLayer(liveRouteLayer);
    state.current = null;
    alert("Walk gespeichert.");
};

// --- STRECKEN VERGLEICHEN ---
function toggleWalk(id) {
    if (state.activeWalkLayers[id]) {
        state.map.removeLayer(state.activeWalkLayers[id]);
        delete state.activeWalkLayers[id];
    } else {
        const walk = state.walks.find(w => w.id == id);
        const group = L.layerGroup();
        
        // Die Strecke als farbiger Pfad
        L.polyline(walk.route, { color: walk.color, weight: 5, className: 'rough-path', opacity: 0.8 }).addTo(group);
        
        // Die erhobenen Daten direkt auf der Strecke
        walk.entries.forEach(e => {
            const loc = [e.location.lat, e.location.lng];
            if (['mood', 'thought', 'sense'].includes(e.type)) {
                L.circleMarker(loc, { radius: 8, fillColor: walk.color, color: '#fff', weight: 2, fillOpacity: 1 })
                 .addTo(group).bindPopup(`<b>${e.type}:</b> ${e.text}`);
            } else {
                const iconTxt = { photo: '📸', Sound: '🔊', Sprachnachricht: '💬' }[e.type];
                const icon = L.divIcon({ html: iconTxt, className: 'text-lg' });
                L.marker(loc, { icon }).addTo(group);
            }
        });
        
        group.addTo(state.map);
        state.activeWalkLayers[id] = group;
        
        // Reflexions-Text laden
        document.getElementById('reflectionText').value = walk.reflection || "";
        document.getElementById('reflectionText').dataset.activeId = id;
    }
}

// Reflexion speichern
document.getElementById('saveReflection').onclick = () => {
    const id = document.getElementById('reflectionText').dataset.activeId;
    if (!id) return alert("Wähle erst eine Strecke im Archiv aus!");
    const walk = state.walks.find(w => w.id == id);
    walk.reflection = document.getElementById('reflectionText').value;
    saveToLocal();
    alert("Reflexion für '" + walk.name + "' gespeichert.");
};

function saveToLocal() {
    localStorage.setItem('myWalks', JSON.stringify(state.walks));
}

function updateArchiveUI() {
    const list = document.getElementById('walkList');
    list.innerHTML = "";
    state.walks.forEach(w => {
        const div = document.createElement('div');
        div.className = "walk-item";
        div.innerHTML = `
            <input type="checkbox" onchange="toggleWalk(${w.id})">
            <span class="color-dot" style="background:${w.color}"></span>
            <span>${w.name}</span>
        `;
        list.appendChild(div);
    });
}

// Hilfsfunktion für Marker (vereinfacht für dieses Beispiel)
function addEntry(type, data = {}) {
    if (!state.current) return alert("Bitte START drücken!");
    navigator.geolocation.getCurrentPosition(pos => {
        if (['mood', 'thought', 'sense'].includes(type)) {
            const txt = prompt(type + " eingeben:");
            if (!txt) return;
            data.text = txt;
        }
        state.current.entries.push({
            type,
            location: { lat: pos.coords.latitude, lng: pos.coords.longitude },
            timestamp: new Date().toLocaleTimeString(),
            ...data
        });
    });
}

// Event Listener für Buttons
document.getElementById('moodBtn').onclick = () => addEntry('mood');
document.getElementById('thoughtBtn').onclick = () => addEntry('thought');
document.getElementById('senseBtn').onclick = () => addEntry('sense');

initMap();
</script>
</body>
</html>
